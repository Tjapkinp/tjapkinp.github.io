baseURL = "https://tjapkinp.github.io/"
theme = "terminal"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = true
enableMissingTranslationPlaceholders = false

[pagination]
  pagerSize = 5

[markup.highlight]
  noClasses = false

[params]
  # COMPATIBILITY: Terminal's original post listing uses this parameter.
  # Keep until the customized home/list templates have been reviewed.
  contentTypeName = "posts"
  showMenuItems = 6
  showLanguageSelector = true
  fullWidthTheme = true
  centerTheme = true
  autoCover = true
  showLastUpdated = false
  readingTime = true
  Toc = true
  TocTitle = "Table of Contents"
  updatedDatePrefix = "Updated"

[languages]
  [languages.ru]
    label = "Русский"
    languageName = "Русский"  # Compatibility with older Terminal templates
    locale = "ru-RU"
    title = "ps_tyapkin"
    weight = 1
    [languages.ru.params]
      subtitle = "ps_tyapkin.ru"
      menuMore = "Читать далее"
      readMore = "Открыть пост"
      readOtherPosts = "Читать другие посты"
      newerPosts = "Новые посты"
      olderPosts = "Старые посты"
      missingContentMessage = "Страница не найдена..."
      missingBackButtonLabel = "Вернуться на главную"
      minuteReadingTime = "минут на прочтение"
      words = "слов"
      [languages.ru.params.logo]
        logoText = "ps_tyapkin"
        logoHomeLink = "/ru/"
    [[languages.ru.menu.main]]
      identifier = "projects"
      name = "Проекты"
      pageRef = "/projects"
      weight = 10
    [[languages.ru.menu.main]]
      identifier = "engineering"
      name = "Инженерия"
      pageRef = "/engineering"
      weight = 20
    [[languages.ru.menu.main]]
      identifier = "linux"
      name = "Linux"
      pageRef = "/linux"
      weight = 30
    [[languages.ru.menu.main]]
      identifier = "travel"
      name = "Путешествия"
      pageRef = "/travel"
      weight = 40
    [[languages.ru.menu.main]]
      identifier = "notes"
      name = "Заметки"
      pageRef = "/notes"
      weight = 50
    [[languages.ru.menu.main]]
      identifier = "about"
      name = "Обо мне"
      pageRef = "/about"
      weight = 60

  [languages.en]
    label = "English"
    languageName = "English"  # Compatibility with older Terminal templates
    locale = "en-US"
    title = "ps_tyapkin"
    weight = 2
    [languages.en.params]
      subtitle = "ps_tyapkin.ru"
      menuMore = "Show more"
      readMore = "Read more"
      readOtherPosts = "Read other posts"
      newerPosts = "Newer posts"
      olderPosts = "Older posts"
      missingContentMessage = "Page not found..."
      missingBackButtonLabel = "Back to home page"
      minuteReadingTime = "min read"
      words = "words"
      [languages.en.params.logo]
        logoText = "ps_tyapkin"
        logoHomeLink = "/en/"
    [[languages.en.menu.main]]
      identifier = "projects"
      name = "Projects"
      pageRef = "/projects"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "engineering"
      name = "Engineering"
      pageRef = "/engineering"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "linux"
      name = "Linux"
      pageRef = "/linux"
      weight = 30
    [[languages.en.menu.main]]
      identifier = "travel"
      name = "Travel"
      pageRef = "/travel"
      weight = 40
    [[languages.en.menu.main]]
      identifier = "notes"
      name = "Notes"
      pageRef = "/notes"
      weight = 50
    [[languages.en.menu.main]]
      identifier = "about"
      name = "About"
      pageRef = "/about"
      weight = 60
